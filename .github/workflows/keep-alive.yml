name: Keep Render Awake

on:
  schedule:
    # Mỗi 10 phút, khung UTC 11h-16h59 = 18h - 23h55 giờ VN
    - cron: '*/10 11-16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        run: |
          echo "Pinging chocudan24h.com at $(date)"
          curl -sSf -o /dev/null -w "Status: %{http_code}\n" https://chocudan24h.com || echo "Ping failed, but job continues"