services:
  - type: web
    name: chocudan24h
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # LUU Y QUAN TRONG: Render FREE khong ho tro persistent disk.
    # Khai bao disk duoi day vo hieu tren goi free. Neu nang len goi tra phi,
    # bo comment de anh upload khong bi mat khi redeploy.
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://chocudan24h.com
